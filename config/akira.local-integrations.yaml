# AKIRA local Mac integration configuration.
# Designed for a local Mac M-series dev machine with external MongoDB, Weaviate, Ollama, and mcp-server-generic.
#
# Expected local services:
# - MongoDB: mongodb://host.docker.internal:27017
# - Weaviate: http://host.docker.internal:8080
# - Ollama: http://host.docker.internal:11434
# - mcp-server-generic: http://host.docker.internal:8088
#
# For manual non-container runs, replace host.docker.internal with 127.0.0.1.

platform:
  name: akira-local
  namespace: akira-local
  imagePullPolicy: IfNotPresent
  observabilityLogDir: /app/data/observability/logs

dependencies:
  api:
    dashboardUrl: http://akira-dashboard:3000
    orchestratorUrl: http://akira-orchestrator:9000
    storageUrl: http://storagemcp-platform:9100
    agentRuntimeUrl: http://agent-runtime:8081
    mcpServerUrl: http://host.docker.internal:8088
    mcpFallbackOnError: true
    natsUrl: nats://nats-jetstream:4222

  db:
    backend: disk
    documentBackend: mongodb
    vectorBackend: weaviate
    storageDataDir: /app/data/storage
    storageClassName: standard
    storageSize: 5Gi
    mongodbUrl: mongodb://host.docker.internal:27017
    mongodbDatabase: akira
    mongodbCollectionPrefix: storage
    weaviateUrl: http://host.docker.internal:8080
    weaviateClassName: AkiraStorageVectorItem
    weaviateApiKeySecretName: akira-storage-secrets
    weaviateApiKeySecretKey: WEAVIATE_API_KEY

  llm:
    modelRouterUrl: ""
    authMode: none
    authHeaderName: Authorization
    defaultProvider: ollama
    defaultModel: llama3.2:latest
    timeoutSeconds: 60
    providersJson: '[{"id":"ollama","label":"Local Ollama","url":"http://host.docker.internal:11434/api/chat","authMode":"none","authHeaderName":"Authorization","defaultModel":"llama3.2:latest","models":["llama3.2:latest","llama3.1:latest","mistral:latest","qwen2.5:latest"],"enabled":true}]'
    roleModelsJson: '{"draft_script":"ollama:llama3.2:latest","citation_validator":"ollama:llama3.2:latest"}'
    stageModelsJson: '{"draft_structure":"ollama:llama3.2:latest","generate_script":"ollama:llama3.2:latest","validate_citations":"ollama:llama3.2:latest"}'
    taskTypeModelsJson: '{"news-podcast":"ollama:llama3.2:latest"}'
    bearerTokenSecretName: akira-model-router-secrets
    bearerTokenSecretKey: MODEL_ROUTER_BEARER_TOKEN
    basicUsernameSecretName: akira-model-router-secrets
    basicUsernameSecretKey: MODEL_ROUTER_BASIC_USERNAME
    basicPasswordSecretName: akira-model-router-secrets
    basicPasswordSecretKey: MODEL_ROUTER_BASIC_PASSWORD
    headerValueSecretName: akira-model-router-secrets
    headerValueSecretKey: MODEL_ROUTER_HEADER_VALUE

  observability:
    elasticsearchUrl: ""
    elasticLogIndexPattern: akira-service-logs-*
    prometheusConfigMap: akira-prometheus-config
    otelCollectorConfigMap: akira-otel-config

services:
  dashboard:
    enabled: true
    name: akira-dashboard
    image: akira-dashboard:latest
    replicas: 1
    port: 3000

  orchestrator:
    enabled: true
    name: akira-orchestrator
    image: akira-orchestrator:latest
    replicas: 1
    port: 9000

  storageMcpPlatform:
    enabled: true
    name: storagemcp-platform
    image: storagemcp-platform:latest
    replicas: 1
    port: 9100

  agentRuntime:
    enabled: true
    name: agent-runtime
    image: akira-agent-runtime:latest
    replicas: 1
    port: 8081

  mcpServerGeneric:
    enabled: false
    name: mcp-server-generic
    image: mcp-server-generic:latest
    replicas: 1
    port: 8088

  nats:
    enabled: true
    name: nats-jetstream
    image: nats:2.10-alpine
    replicas: 1
    clientPort: 4222
    monitorPort: 8222
    args: -js

  prometheus:
    enabled: false
    name: prometheus
    image: prom/prometheus:v2.54.1
    replicas: 1
    port: 9090

  otelCollector:
    enabled: false
    name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.108.0
    replicas: 1

  elasticsearch:
    enabled: false
    name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    replicas: 1
    port: 9200
