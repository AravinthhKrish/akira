apiVersion: apps/v1
kind: Deployment
metadata:
  name: akira-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akira-dashboard
  template:
    metadata:
      labels:
        app: akira-dashboard
    spec:
      containers:
        - name: dashboard
          image: akira-dashboard:latest
          ports:
            - containerPort: 3000
          env:
            - name: ORCHESTRATOR_URL
              value: http://akira-orchestrator:9000
---
apiVersion: v1
kind: Service
metadata:
  name: akira-dashboard
spec:
  selector:
    app: akira-dashboard
  ports:
    - port: 3000
      targetPort: 3000

