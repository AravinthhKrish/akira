apiVersion: apps/v1
kind: Deployment
metadata:
  name: akira-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akira-orchestrator
  template:
    metadata:
      labels:
        app: akira-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: akira-orchestrator:latest
          ports:
            - containerPort: 9000
          env:
            - name: STORAGE_URL
              value: http://storagemcp-platform:9100
            - name: AGENT_RUNTIME_URL
              value: http://agent-runtime:8081
            - name: MCP_SERVER_URL
              value: http://mcp-server-generic:8080
---
apiVersion: v1
kind: Service
metadata:
  name: akira-orchestrator
spec:
  selector:
    app: akira-orchestrator
  ports:
    - port: 9000
      targetPort: 9000

